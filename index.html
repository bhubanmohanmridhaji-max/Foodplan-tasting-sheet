function parseMenu(rows,D){
  const entries=[];
  const hr=rows.findIndex(r=>r&&r.filter(c=>dIdx(c)>=0).length>=5);
  if(hr>=0){
    const cols={};rows[hr].forEach((c,j)=>{const k=dIdx(c);if(k>=0&&cols[k]==null)cols[k]=j});
    const lc=Math.max(Math.min(...Object.values(cols))-1,0);
    for(let r=hr+1;r<rows.length;r++){const row=rows[r]||[],lab=tx(row[lc]);if(!lab)continue;
      const cells=DK.map((_,k)=>cols[k]==null?"":tx(row[cols[k]]));
      if(cells.every(x=>!x))continue;entries.push({label:lab,cells})}
  }else{
    let dc=-1;const nc=Math.max(0,...rows.map(r=>r?r.length:0));
    for(let j=0;j<nc;j++){if(rows.filter(r=>r&&dIdx(r[j])>=0).length>=5){dc=j;break}}
    if(dc<0)return null;
    const fr=rows.findIndex(r=>r&&dIdx(r[dc])>=0);if(fr<1)return null;
    const dayRows={};for(let r=fr;r<rows.length;r++){const k=dIdx((rows[r]||[])[dc]);if(k>=0&&!dayRows[k])dayRows[k]=rows[r]}
    (rows[fr-1]||[]).forEach((h,j)=>{if(j===dc||!tx(h))return;
      const cells=DK.map((_,k)=>dayRows[k]?tx(dayRows[k][j]):"");
      if(cells.some(x=>x))entries.push({label:tx(h),cells})});
  }
  const bases=D.meals.map(nz),map=Array(D.meals.length).fill(-1),used=new Set();
  const pass=fn=>entries.forEach((e,ei)=>{if(used.has(ei))return;const n=nz(e.label);if(!n)return;
    const i=bases.findIndex((b,bi)=>map[bi]<0&&fn(n,b));if(i>=0){map[i]=ei;used.add(ei)}});
  pass((n,b)=>n===b);pass((n,b)=>n.length>=4&&(b.includes(n)||n.includes(b)));
  const matched=D.meals.filter((_,i)=>map[i]>=0);
  if(!matched.length)return null;
  return{grid:DK.map((_,d)=>D.meals.map((_,i)=>map[i]>=0?entries[map[i]].cells[d]:"")),matched,
    missing:D.meals.filter((_,i)=>map[i]<0),unmatched:entries.filter((_,i)=>!used.has(i)).map(e=>e.label)}
}
function csvRows(t){const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===","){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}
    else cur+=c}
  row.push(cur);rows.push(row);return rows}

function syncMenus(D){const g=menuFor(D,week(S.date),dow(S.date));S.rows[D.id].forEach((r,i)=>r.menu=g[i]||"")}
function uploadMenu(D,file,wk){

    if(!res){UM[D.id]="No menu found in "+file.name+". Use days (Monday–Sunday) across the top with meals down the side, or days down the side with meals across the top.";return render()}
    const all=LS.get("hm_menus",{}),u=all[D.id]||{name:file.name};
    u.name=file.name;u.at=new Date().toISOString();
    if(D.id==="sc"){u.weeks=u.weeks||{};if(wk==="all"){u.all=res.grid}else{u.weeks[+wk]=res.grid}}else u.grid=res.grid;
    all[D.id]=u;LS.set("hm_menus",all);syncMenus(D);
    UM[D.id]="Loaded "+file.name+(D.id==="sc"?(wk==="all"?" for all weeks":" for Week "+(+wk+1)):"")+". Matched: "+res.matched.join(", ")+"."+
      (res.missing.length?" Not found in file: "+res.missing.join(", ")+".":"")+(res.unmatched.length?" Ignored rows/columns: "+res.unmatched.join(", ")+".":"");
    render()});

async function exportDocx(){

function buildTasteParts(forms){

  const sp=(pb,line)=>`<w:p><w:pPr>${pb?"<w:pageBreakBefore/>":""}<w:spacing w:before="0" w:after="0" w:line="${line}" w:lineRule="exact"/></w:pPr></w:p>`;
  const A='xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"';
  const img=`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="1296000" cy="803520"/><wp:docPr id="1" name="Logo"/><wp:cNvGraphicFramePr><a:graphicFrameLocks ${A} noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic ${A}><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="1" name="logo.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rId2"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="1296000" cy="803520"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
  const SCALE="SCALE: 1- WORST, 2-SUPER BAD, 3-REALLY BAD, 4-BAD, 5-MAY BE GOOD OR MAYNOT BE, 6-JUST LITTLE GOOD, 7-GOOD, 8-REALLY GOOD, 9-SUPER GOOD, 10-EXCELLENT.";
  const HD=["SI NO","Tasted sample Name","BATCH NO","APPEARANCE","FLAVOUR","TASTE","COOKED/BOILED PROPERLY","OVERALL TASTE","TASTED TIME","Remarks","SIGN."];

    body+=sp(k>0&&k%2===0,k%2===0?20:200);

      (i===0?tc(W1[0],tp(img,{jc:"center"}),{vm:"r"}):tc(W1[0],tp(""),{vm:"c"}))+
      (i===0?tc(W1[1],tp(wRun("MAXIMUMS - Food & Beverage",{b:1,c:"4B0F8F",s:40}),{jc:"center"}),{vm:"r"}):i===3?tc(W1[1],tp(wRun("TASTE AND TEXTURE REPORT",{b:1,s:28}),{jc:"center"}),{vm:"r"}):tc(W1[1],tp(""),{vm:"c"}))+
      tc(W1[2],tp(wRun(x[0],{s:18})))+tc(W1[3],tp(wRun(x[1],{s:18}),{jc:"center"})))).join(""))+sp(0,20);
    body+=tbl(W2,
      tr(300,tc(W2[0],tp(wRun("NAME OF THE PANELIST: "+(f.taster||""),{b:1,s:20})))+tc(W2[1],tp(wRun(SCALE,{b:1,c:"0033CC",s:15})),{vm:"r"}))+
      tr(300,tc(W2[0],tp(wRun("DATE : "+dateStr,{b:1,s:20})+wRun("      DEPARTMENT: "+f.label,{b:1,s:18})))+tc(W2[1],tp(""),{vm:"c"})))+sp(0,20);
    let rows=tr(520,HD.map((h,i)=>tc(W3[i],tp(wRun(h,{b:1,s:i===1||i===9||i===10?20:15}),{jc:"center"}))).join(""));
    for(let i=0;i<6;i++)rows+=tr(330,W3.map((w,j)=>tc(w,j===0?tp(wRun(String(i+1),{s:20}),{jc:"center"}):j===1?tp(wRun(f.items[i]||"",{s:18})):tp(""))).join(""));

  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return{

    "_rels/.rels":X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>',
    "word/_rels/document.xml.rels":X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.png"/></Relationships>',
    "word/styles.xml":X+`<w:styles ${NS}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="20"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`,
    "word/document.xml":X+`<w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="400" w:right="520" w:bottom="400" w:left="520" w:header="200" w:footer="200" w:gutter="0"/></w:sectPr></w:body></w:document>`};
}
async function exportTaste(){
  const m=$("#msg");
  try{
    const forms=tasteForms();
    if(!forms.length){m.textContent="There are no menu items for "+S.date+" to build a tasting sheet from.";return}
    if(!window.JSZip){m.textContent="The Word export library could not load. Check your connection and reload.";return}
    const z=new JSZip(),parts=buildTasteParts(forms);
    Object.keys(parts).forEach(k=>z.file(k,parts[k]));
    z.file("word/media/logo.png",Uint8Array.from(atob(LOGO),c=>c.charCodeAt(0)));
    const blob=await z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    await saveFile("Tasting-Sheet-"+S.date+".docx",blob);
    m.textContent="Tasting sheet ready for "+S.date+" ("+forms.length+" forms).";
  }catch(e){m.textContent=e&&e.code==="declined"?"Export cancelled.":"Export failed: "+(e&&e.message||"unknown error")}
}
async function saveFile(name,blob){
  const dl=window.claude&&claude.use?await claude.use("downloads"):null;
  if(dl){await dl.save({filename:name,data:blob});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
const XH=["FPID","Date","Day","Department","Meal","Menu","Total pax","Outlet pax","Planned qty","Prepared qty","Issued qty","Unit","Pending prep","Balance","Remarks","Tasted by"];
function flat(date,rec){
  const rows=[],pxl=[],day=DAY[dow(date)],O=rec.outlets||OUT0;
  DEPTS.forEach(D=>(rec.rows[D.id]||[]).forEach((r,i)=>{
    const k=calc(r),px=r.px||{};
    const ol=D.id==="sc"?O.filter(o=>px[o.id]!==undefined&&px[o.id]!=="").map(o=>{pxl.push([date,day,D.name,D.meals[i],o.name,num(px[o.id])]);return o.name+" "+px[o.id]}).join("; "):"";
    rows.push([fpid(date),date,day,D.name,D.meals[i],r.menu,num(r.pax),ol,num(r.plan),num(r.prep),num(r.iss),r.unit||"",k.pend===""?null:k.pend,k.bal===""?null:k.bal,r.rem||"",(rec.taste||{})[D.id]||""])}));
  return{rows,pxl}}
function addSheet(wb,name,aoa,wd){const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=wd.map(w=>({wch:w}));ws["!freeze"]={xSplit:0,ySplit:1};XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))}
async function exportXlsx(kind){
  const m=$("#msg");
  try{
    if(!window.XLSX){m.textContent="The Excel library could not load. Check your connection and reload.";return}
    let recs,label;
    if(kind==="day"){recs=[[S.date,{rows:S.rows,outlets:outlets(),taste:S.taste}]];label=S.date}
    else{
      label=kind==="month"?S.date.slice(0,7):S.date.slice(0,4);
      const all=LS.get("hm_fp",{});
      recs=Object.keys(all).map(k=>[all[k].date,all[k]]).filter(x=>x[0].startsWith(label)).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
      if(!recs.length){m.textContent="No saved production records for "+label+". Save production for those dates first.";return}}
    const R=[],P=[];recs.forEach(([d,rec])=>{const f=flat(d,rec);R.push(...f.rows);P.push(...f.pxl)});
    const wb=XLSX.utils.book_new();
    addSheet(wb,kind==="day"?"Day "+label:"Records",[XH,...R],[16,12,11,16,18,70,10,40,11,11,11,8,12,10,24,22]);
    addSheet(wb,"Outlet pax",[["Date","Day","Department","Meal","Outlet","Pax"],...P],[12,11,16,18,20,8]);
    if(kind!=="day"){
      const dep=new Map(),qty=new Map(),mon=new Map();
      R.forEach(r=>{
        const dk=r[3];const e=dep.get(dk)||{days:new Set(),pax:0};e.days.add(r[1]);e.pax+=r[6]||0;dep.set(dk,e);
        const mk=r[1].slice(0,7)+"|"+dk;const q=mon.get(mk)||{days:new Set(),pax:0};q.days.add(r[1]);q.pax+=r[6]||0;mon.set(mk,q);
        if(r[11]){const uk=dk+"|"+r[11];const u=qty.get(uk)||{p:0,r:0,i:0};u.p+=r[8]||0;u.r+=r[9]||0;u.i+=r[10]||0;qty.set(uk,u)}});
      addSheet(wb,"Dept summary",[["Department","Days recorded","Total pax (all meals)"],...[...dep].map(([k,v])=>[k,v.days.size,v.pax])],[18,14,20]);
      if(kind==="year")addSheet(wb,"Monthly summary",[["Month","Department","Days recorded","Total pax (all meals)"],...[...mon].sort((a,b)=>a[0]<b[0]?-1:1).map(([k,v])=>{const s=k.split("|");return[s[0],s[1],v.days.size,v.pax]})],[10,18,14,20]);
      addSheet(wb,"Quantity totals",[["Department","Unit","Planned","Prepared","Issued","Balance (prepared - issued)"],...[...qty].map(([k,v])=>{const s=k.split("|");return[s[0],s[1],v.p,v.r,v.i,v.r-v.i]})],[18,8,12,12,12,22]);
    }
    const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    await saveFile("Production-"+(kind==="day"?"Day":kind==="month"?"Month":"Year")+"-"+label+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    m.textContent="Excel "+kind+" export ready ("+recs.length+" "+(recs.length===1?"day":"days")+").";
  }catch(e){m.textContent=e&&e.code==="declined"?"Export cancelled.":"Export failed: "+(e&&e.message||"unknown error")}
}
